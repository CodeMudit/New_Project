<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PROJECT NEXUS // SECURE NODE TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    :root {
      --crt-green: #00ff66;
      --crt-green-dim: rgba(0, 255, 102, 0.15);
      --bg: #030a06;
      --card-bg: #07150c;
    }
    body {
      background-color: var(--bg);
      color: var(--crt-green);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* CRT SCREEN FRAME & EFFECTS */
    .crt-monitor {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 480px;
      background: radial-gradient(circle at center, #07180e 0%, #020704 100%);
      border: 2px solid #00aa44;
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.2), inset 0 0 40px rgba(0,0,0,0.8);
      padding: 22px 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Scanlines */
    .crt-monitor::before {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
      opacity: 0.6;
    }

    /* CRT Flicker */
    .crt-flicker {
      position: absolute;
      inset: 0;
      background: rgba(0, 255, 102, 0.02);
      opacity: 0;
      z-index: 21;
      pointer-events: none;
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.1; }
      50% { opacity: 0.25; }
      100% { opacity: 0.1; }
    }

    .terminal-header {
      border-bottom: 1px dashed #00aa44;
      padding-bottom: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #70ffaa;
      font-weight: 700;
    }

    .terminal-body {
      font-size: 13.5px;
      line-height: 1.6;
      flex-grow: 1;
      white-space: pre-line;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    }

    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--crt-green);
      animation: blink 0.7s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    /* ACTION BUTTONS */
    .btn-terminal {
      width: 100%;
      height: 48px;
      background: var(--crt-green-dim);
      border: 1px solid var(--crt-green);
      color: var(--crt-green);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
      margin-top: 14px;
      transition: background 0.15s ease, transform 0.1s ease;
      position: relative;
      z-index: 25;
    }
    .btn-terminal:hover {
      background: var(--crt-green);
      color: #020704;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
    }
    .btn-terminal:active { transform: scale(0.98); }

    /* REVEAL MATRIX CONTAINER */
    .terms-box {
      border: 1px dashed #00aa44;
      background: rgba(0, 255, 102, 0.04);
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 12.5px;
    }
    .term-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .term-line:last-child { margin-bottom: 0; }

    /* CRT POWER COLLAPSE / WARP TRANSITION */
    .crt-collapse {
      animation: crtOff 0.5s ease-out forwards !important;
    }
    @keyframes crtOff {
      0% { transform: scale(1); filter: brightness(1); }
      40% { transform: scale(1, 0.005); filter: brightness(5); }
      100% { transform: scale(0, 0); opacity: 0; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="crt-monitor" id="crtFrame">
    <div class="crt-flicker"></div>
    
    <div>
      <div class="terminal-header">
        <span>DEV://TTY_NEXUS_ROOT</span>
        <span>BAUD: 9600 BAUD</span>
      </div>

      <div class="terminal-body" id="termLog">
        &gt; SYSTEM BOOTLOADER v4.09
        &gt; INITIALIZING ENCRYPTED HANDSHAKE...
      </div>
    </div>

    <div id="actionArea">
      <button class="btn-terminal" id="btnAction" onclick="executeBootSequence()">
        [ EXECUTE ACCESS SEQUENCE ]
      </button>
    </div>
  </div>

  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function playKeyClick() {
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(600 + Math.random() * 400, ctx.currentTime);
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.03);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.03);
    }

    function playSuccessBeep() {
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    }

    const scriptLines = [
      "> VERIFYING FORENSIC CLEARANCE TOKEN...",
      "> BYPASSING SUBNET LOCKOUT (NODE 0x4F)...",
      "> ACCESS AUTHORIZED // CLEARANCE PASS #0492"
    ];

    let currentLine = 0;
    function executeBootSequence() {
      document.getElementById('btnAction').disabled = true;
      document.getElementById('btnAction').style.opacity = '0.5';

      let interval = setInterval(() => {
        if (currentLine < scriptLines.length) {
          playKeyClick();
          document.getElementById('termLog').innerHTML += "\n" + scriptLines[currentLine];
          currentLine++;
        } else {
          clearInterval(interval);
          playSuccessBeep();
          revealTerms();
        }
      }, 350);
    }

    function revealTerms() {
      const area = document.getElementById('actionArea');
      area.innerHTML = `
        <div class="terms-box">
          <div class="term-line"><span>NODE 01:</span><strong>30s Rapid Fire</strong></div>
          <div class="term-line"><span>NODE 02:</span><strong>Network T9 Decryption</strong></div>
          <div class="term-line"><span>NODE 03:</span><strong>RFID Investigation</strong></div>
          <div class="term-line"><span>ENTRY:</span><strong>₹100 / Team (Max 4)</strong></div>
        </div>
        <button class="btn-terminal" onclick="enterTournament()" style="margin-top:10px; background:#00ff66; color:#000;">
          &gt; ACCEPT INVITATION & ENTER &lt;
        </button>
      `;
    }

    function enterTournament() {
      document.getElementById('crtFrame').classList.add('crt-collapse');
      setTimeout(() => {
        window.location.href = '/register.html';
      }, 500);
    }
  </script>
</body>
</html>
